---
services:
  db:
    # Plain Postgres (no pg_cron) — the core suite and tests/multidb run here so
    # they cannot depend on the extension.
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - "${PGPORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  db_pg_cron:
    # pg_cron-enabled Postgres for tests/pg_cron/. cron.database_name points at the
    # CENTRAL `postgres` DB (where the extension + cron.* catalog live); the suite's
    # ordinary test DB holds NO extension and schedules cross-database into it.
    build:
      context: .
      dockerfile: Dockerfile.pg_cron
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=postgres
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - "${PGPORT_PGCRON:-5443}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
