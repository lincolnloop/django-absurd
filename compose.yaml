---
services:
  db:
    # Plain Postgres (no pg_cron) — the core suite and tests/multidb run here so
    # they cannot depend on the extension.
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - "${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  db_pg_cron:
    # pg_cron-enabled Postgres for tests/pg_cron/. cron.database_name points at the
    # CENTRAL `postgres` DB (where the extension + cron.* catalog live); the suite's
    # ordinary test DB holds NO extension and schedules cross-database into it.
    build:
      context: .
      dockerfile: Dockerfile.pg_cron
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=postgres
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - "${PGPORT_PGCRON:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  db_bench:
    # In this file so one `docker compose` reaches every service, but a separate server
    # on purpose. It keeps an exact patch tag, a pinned server config and a named
    # volume, so a re-run months later measures the same server; it publishes a port no
    # other service uses, because a benchmark that quietly measured the wrong one would
    # still print numbers; and it stays off `db`, which the suites hammer with real
    # worker subprocesses that a benchmark sharing the server would silently absorb.
    #
    # Profiled so a bare `docker compose up -d` starts the suites' databases and not a
    # tuned server and a volume nobody asked for. Naming it on the command line still
    # starts it, which is what `benchmarks/README.md` tells the reader to do.
    profiles:
      - bench
    image: postgres:18.4
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - max_connections=100
      - -c
      - synchronous_commit=on
      - -c
      - fsync=on
      - -c
      - autovacuum=on
      - -c
      - log_min_messages=warning
    environment:
      - POSTGRES_DB=absurd_bench
      - POSTGRES_PASSWORD=postgres
    ports:
      - "${PGPORT_BENCH:-5460}:5432"
    volumes:
      - bench_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d absurd_bench"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bench_pgdata:
