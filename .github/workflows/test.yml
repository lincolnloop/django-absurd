---
name: test

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

concurrency:
  # Abort pending builds if there's an update.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tox:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - py312-django60
          - py312-django61
          - py314-django61
          - dev
          - py312-django61-mypy
          - py314-django61-mypy
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PGPORT: "5432"
      PGPORT_PGCRON: "5434"
      # Worker count for tox's `-n auto`; a runner has more cores than the suites
      # profitably use, and 2 is enough to keep the parallel path exercised.
      PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Start Postgres services
        run: docker compose up -d --build --wait db db_pg_cron
      - name: Run tox
        run: uvx --with tox-uv tox -e "${{ matrix.env }}"
      - name: Upload coverage to Codecov
        if: ${{ (success() || failure()) && !contains(matrix.env, 'mypy') }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.env }}
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        if: ${{ (success() || failure()) && !contains(matrix.env, 'mypy') }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          flags: ${{ matrix.env }}
          fail_ci_if_error: true
          files: junit-core.xml,junit-pg_cron.xml,junit-multidb.xml

  examples:
    name: examples/${{ matrix.example }} pytest suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: web
          - example: beat
          - example: pg_cron
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run the suite in its Docker stack
        run: |
          docker compose up -d --build db
          until docker compose exec -T db pg_isready -U postgres; do sleep 1; done
          docker compose run --rm --build app sh -c "cd /app && pytest"
      - name: Rewrite container coverage paths to repo-relative
        if: ${{ success() || failure() }}
        run: |
          sudo sed -i \
            "s#<source>/app#<source>examples/${{ matrix.example }}#g" \
            coverage.xml
      - name: Upload coverage to Codecov
        if: ${{ success() || failure() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: examples-${{ matrix.example }}
          fail_ci_if_error: true
          files: examples/${{ matrix.example }}/coverage.xml
      - name: Upload test results to Codecov
        if: ${{ success() || failure() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          flags: examples-${{ matrix.example }}
          fail_ci_if_error: true
          files: examples/${{ matrix.example }}/junit-examples-${{ matrix.example }}.xml

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history + tags so setuptools-scm can derive the version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build sdist + wheel
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
