[pytest]
DJANGO_SETTINGS_MODULE = "tests.multidb.settings"
addopts = [
  "--allow-hosts=db,localhost,127.0.0.1",
  "--confcutdir=..",
  "--cov",
  "--cov-append",
  "--cov-report=term",
  "--cov-report=xml",
  "--disable-socket",
  "--junitxml=junit-multidb.xml",
  "--reuse-db",
  "--strict-markers",
]
pythonpath = ["../.."]
testpaths = ["."]
# See tests/core/pytest.toml: nothing here waits on a clock (whole suite runs in <1s).
timeout = "10"
