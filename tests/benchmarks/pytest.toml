[pytest]
DJANGO_SETTINGS_MODULE = "tests.benchmarks.settings"
addopts = [
  "--confcutdir=..",
  # Only this suite runs `benchmarks/`, so only it measures it; the others would report
  # it unexecuted, with lines that differ between Python versions.
  "--cov=benchmarks",
  "--cov=django_absurd",
  "--cov=tests",
  "--cov-append",
  "--cov-report=term",
  "--cov-report=xml",
  "--junitxml=junit-benchmarks.xml",
  "--reuse-db",
  "--strict-markers",
]
pythonpath = ["../..", "../../benchmarks"]
testpaths = ["."]
# Real workers on real time; the whole suite is well under this.
timeout = "120"
