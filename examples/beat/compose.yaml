---
services:
  db:
    image: postgres:18.4-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - beat_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 30

  # Provisioning is a deploy step: nothing at runtime creates a queue any more, so
  # the worker refuses to start until this has run. One-shot, and both long-running
  # services gate on it completing.
  migrate:
    build:
      context: ../..
      dockerfile: examples/beat/Dockerfile
    command: nanodjango manage app.py migrate
    depends_on:
      db:
        condition: service_healthy
    environment: &env
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=postgres
    volumes: &mounts
      - ./:/app
      - ../../django_absurd:/src/django_absurd

  app:
    build:
      context: ../..
      dockerfile: examples/beat/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    ports:
      - "${APP_PORT:-8000}:8000"
    environment: *env
    volumes: *mounts

  worker:
    build:
      context: ../..
      dockerfile: examples/beat/Dockerfile
    command: nanodjango manage app.py absurd_worker --beat
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    environment: *env
    volumes: *mounts

volumes:
  beat_pgdata:
