---
services:
  db:
    build:
      context: ../..
      dockerfile: Dockerfile.pg_cron
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      # The CENTRAL pg_cron DB (extension + cron.* catalog live here). The app's own
      # `demo` DB holds no extension and is scheduled cross-database into. The test run
      # uses this SAME central DB — its test DB is ordinary + extension-less, so no
      # settings override is needed to reach it.
      - cron.database_name=postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=demo
    volumes:
      - pg_cron_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 30

  # Provisioning is a deploy step: migrate is what creates the queues, and the worker
  # refuses to start until this has run. One-shot, and both long-running services gate
  # on it completing.
  migrate:
    build:
      context: ../..
      dockerfile: examples/pg_cron/Dockerfile
    command: nanodjango manage app.py migrate
    depends_on:
      db:
        condition: service_healthy
    environment: &env
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=demo
    volumes: &mounts
      - ./:/app
      - ../../django_absurd:/src/django_absurd

  app:
    build:
      context: ../..
      dockerfile: examples/pg_cron/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    ports:
      - "${APP_PORT:-8000}:8000"
    environment: *env
    volumes: *mounts

  worker:
    build:
      context: ../..
      dockerfile: examples/pg_cron/Dockerfile
    command: nanodjango manage app.py absurd_worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    environment: *env
    volumes: *mounts

volumes:
  pg_cron_pgdata:
