---
services:
  db:
    build:
      context: ../..
      dockerfile: Dockerfile.pg_cron
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      # The CENTRAL pg_cron DB (extension + cron.* catalog live here). The app's own
      # `demo` DB holds no extension and is scheduled cross-database into. The test run
      # uses this SAME central DB — its test DB is ordinary + extension-less, so no
      # CRON_DATABASE_NAME override is needed (the cross-DB refactor removed that hack).
      - cron.database_name=postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=demo
    volumes:
      - pg_cron_pgdata:/var/lib/postgresql

  app:
    build:
      context: ../..
      dockerfile: examples/pg_cron/Dockerfile
    depends_on:
      - db
    restart: on-failure
    ports:
      - "8000:8000"
    environment: &env
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=demo
    volumes: &mounts
      - ./:/app
      - ../../django_absurd:/src/django_absurd

  worker:
    build:
      context: ../..
      dockerfile: examples/pg_cron/Dockerfile
    command: nanodjango manage app.py absurd_worker
    depends_on:
      - app
    restart: on-failure
    environment: *env
    volumes: *mounts

volumes:
  pg_cron_pgdata:
