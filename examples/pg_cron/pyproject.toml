[dependency-groups]
dev = [
  "pytest-cov==7.1.0",
  "pytest-django==4.14.0",
  "pytest==9.1.1",
]

[project]
dependencies = [
  "django-absurd",
  "django==6.1",
  "nanodjango==0.16.3",
  "psycopg[binary]==3.3.4",
]
name = "django-absurd-example-pg-cron"
requires-python = "==3.14.*"
version = "0"

[tool.coverage]

[tool.coverage.run]
branch = true
source = ["app", "tests"]

# django-absurd from the local checkout (repo root), so the demo exercises THIS
# branch's code — not a released version.
[tool.uv.sources]
django-absurd = {path = "../..", editable = true}
