[tox]
requires =
    tox>=4.22
    tox-uv>=1.16
env_list =
    py312-django60
    py3{12,14}-django61
    dev
    bench_harness
    py312-django61-mypy
    py314-django61-mypy

[testenv]
runner = uv-venv-runner
dependency_groups = dev
deps =
    django60: django>=6.0,<6.1
    django61: django>=6.1,<6.2
uv_resolution =
    py312: lowest-direct
    py3{13,14}: highest
pass_env =
    PG*
    PYTEST_XDIST_AUTO_NUM_WORKERS
# `-n auto` because xdist reads PYTEST_XDIST_AUTO_NUM_WORKERS for `auto` alone: CI pins 2,
# a workstation sets its own. Here rather than a suite's addopts so bare pytest stays serial.
commands =
    !mypy: pytest tests/core -m "not packaging" -n auto {posargs}
    !mypy: pytest tests/pg_cron -n auto {posargs}
    !mypy: pytest tests/multidb -n auto {posargs}
    mypy: mypy .

[testenv:dev]
runner = uv-venv-lock-runner
commands =
    pytest tests/core -n auto {posargs}
    pytest tests/pg_cron -n auto {posargs}
    pytest tests/multidb -n auto {posargs}

# `tests/benchmarks` has an env to itself so CI runs it as a job of its own alongside the
# rest of the matrix. Named for the harness, not for benchmarking: it exercises
# `benchmarks/` at a handful of tasks per stage and measures nothing. One Python and one
# Django is all the signal there is — `benchmarks/` ships in no wheel and imports nothing
# version-sensitive.
[testenv:bench_harness]
runner = uv-venv-lock-runner
commands =
    pytest tests/benchmarks -n auto {posargs}
