[tox]
requires =
    tox>=4.22
    tox-uv>=1.16
env_list =
    py312-django60
    py3{12,14}-django61
    dev
    py312-django61-mypy
    py314-django61-mypy

[testenv]
runner = uv-venv-runner
dependency_groups = dev
deps =
    django60: django>=6.0,<6.1
    django61: django>=6.1,<6.2
uv_resolution =
    py312: lowest-direct
    py3{13,14}: highest
pass_env = PG*
commands =
    !mypy: pytest tests/core -m "not packaging" {posargs}
    !mypy: pytest tests/pg_cron {posargs}
    !mypy: pytest tests/multidb {posargs}
    mypy: mypy .

[testenv:dev]
runner = uv-venv-lock-runner
commands =
    pytest tests/core {posargs}
    pytest tests/pg_cron {posargs}
    pytest tests/multidb {posargs}
