---
services:
  db_bench:
    # Separate from the root compose services on purpose: a persistent volume, an
    # exact patch tag and a pinned config, so a re-run months later measures the same
    # server. The harness itself runs on the host, so this publishes a port — one
    # nowhere near the suites' (5432/5434) or a system cluster's, because a benchmark
    # that quietly measured another server would still produce numbers.
    image: postgres:18.4
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - max_connections=100
      - -c
      - synchronous_commit=on
      - -c
      - fsync=on
      - -c
      - autovacuum=on
      - -c
      - log_min_messages=warning
    environment:
      - POSTGRES_DB=absurd_bench
      - POSTGRES_PASSWORD=postgres
    ports:
      - "${PGPORT_BENCH:-5460}:5432"
    volumes:
      - bench_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d absurd_bench"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bench_pgdata:
