---
services:
  db_bench:
    # Separate from the root compose services on purpose: a persistent volume and a
    # pinned config, so a re-run months later measures the same server.
    image: postgres:18
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - max_connections=100
      - -c
      - synchronous_commit=on
      - -c
      - fsync=on
      - -c
      - autovacuum=on
      - -c
      - log_min_messages=warning
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - "${PGPORT_BENCH:-5435}:5432"
    volumes:
      - bench_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  bench:
    # Runs the whole benchmark in a container wired to db_bench. Opt-in via the
    # profile so `up -d db_bench` alone never starts a 75-minute run.
    profiles: ["bench"]
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    working_dir: /app
    environment:
      - PGHOST=db_bench
      - PGPORT_BENCH=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=postgres
      # Keep the container's venv off the bind mount so it never clobbers the host's.
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - UV_LINK_MODE=copy
      # hatch-vcs needs git history the slim image does not carry; the wheel's
      # version number is irrelevant to a benchmark run.
      - SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0
    volumes:
      - ..:/app
      - bench_uv_cache:/root/.cache/uv
    depends_on:
      db_bench:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        uv sync --frozen
        && uv run python benchmarks/manage.py migrate
        && uv run python -m benchmarks.stages --all

volumes:
  bench_pgdata:
  bench_uv_cache:
