---
services:
  db_bench:
    # Separate from the root compose services on purpose: a persistent volume, an
    # exact patch tag and a pinned config, so a re-run months later measures the same
    # server. No `ports:` — every measurement runs in a container on this network, so
    # one regime is measured instead of two.
    image: postgres:18.4
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - max_connections=100
      - -c
      - synchronous_commit=on
      - -c
      - fsync=on
      - -c
      - autovacuum=on
      - -c
      - log_min_messages=warning
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - bench_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Absurd's tables come from a migration, and the workers refuse to start without
  # them. One-shot, and the benchmark run gates on it completing.
  migrate:
    build: &image
      context: ..
      dockerfile: benchmarks/Dockerfile
    command: python benchmarks/manage.py migrate
    depends_on:
      db_bench:
        condition: service_healthy
    environment: &env
      - DATABASE_URL=postgres://postgres:postgres@db_bench:5432/postgres
    volumes: &mounts
      - ./:/src/benchmarks
      - ../django_absurd:/src/django_absurd

  bench:
    # Runs every stage against db_bench. Opt-in via the profile so `up -d` alone
    # never starts a 75-minute run.
    profiles: ["bench"]
    build: *image
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *env
    volumes: *mounts

volumes:
  bench_pgdata:
