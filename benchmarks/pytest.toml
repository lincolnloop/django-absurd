[pytest]
DJANGO_SETTINGS_MODULE = "benchmarks.settings"
addopts = [
  "--reuse-db",
  "--strict-markers",
]
markers = [
  "functional: crosses a real boundary (DB, subprocess, filesystem)",
  "integration: end-to-end through external systems",
  "internal: pure in-process logic",
]
pythonpath = [".."]
testpaths = ["tests"]
# Real workers on real time; the whole smoke is well under this.
timeout = "120"
